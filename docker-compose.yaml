services:
  fgbc-eval:
    image: fgbc-eval:latest
    cpuset: ${CORES:-0,1}
    privileged: true
    devices:
      - /dev/cpu_dma_latency
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - ${COVERAGE_OUT}:/data/coverage/
      - /sys:/sys
    tty: true
    stdin_open: true
#    entrypoint: /app/do_SRS.sh
